name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout mamba upstream refs
        uses: actions/checkout@v4
        with:
          repository: mamba-org/mamba
          ref: 30ab0dde384d0055939d767577a05b6078bb2887
          path: mamba
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout mamba upstream refs
        uses: actions/checkout@v4
        with:
          repository: mamba-org/mamba
          ref: 30ab0dde384d0055939d767577a05b6078bb2887
          path: mamba
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: cargo test --workspace
