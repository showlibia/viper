[workspace]
members = [
    "crates/viper-core",
    "crates/viper-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["matrix"]
license = "BSD-3-Clause"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6.0"
